[package]
name = "tyg"
version = "1.2.0"
edition = "2024"
rust-version = "1.99"
authors = ["SirCesarium"]
description = "Generate types from several data sources to multiple languages"
license = "MIT"
repository = "https://github.com/SirCesarium/tyg"
readme = "README.md"
keywords = [
  "codegen",
  "json-to-rust",
  "schema-generator",
  "serialization",
  "cli",
]
categories = ["command-line-utilities", "development-tools", "parsing"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
java-properties = "2.0.0"
json_typegen_shared = { version = "0.7.0", default-features = false }
miette = { version = "7.6.0", features = ["fancy"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "rustls",
  "charset",
  "http2",
] }
serde-saphyr = "2.0.0"
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
absolute_paths = "deny"

[package.metadata.deb]
maintainer = "Cesarium <239650612+SirCesarium@users.noreply.github.com>"
copyright = "2026, Cesarium"
license-file = ["LICENSE", "0"]
section = "utility"
depends = "$auto"
extended-description = "Generate types from several data sources to multiple languages."
assets = [
    ["target/release/tyg", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tyg/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tyg", dest = "/usr/bin/tyg", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/tyg/LICENSE", mode = "644" },
]
